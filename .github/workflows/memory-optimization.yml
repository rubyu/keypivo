name: Memory optimization comparison

on:
  workflow_dispatch:
    inputs:
      include_candidates:
        description: Also compare allocation-only and conservative-GC candidates
        type: boolean
        default: false
  pull_request:
    branches: [develop]
    paths:
      - src/Keypivo.Core/DeviceState.cs
      - src/Keypivo.Core/UsbipdClient.cs
      - src/Keypivo.Core/ProcessCommandRunner.cs
      - src/Keypivo/RuntimeConfiguration.props
      - tests/Keypivo.UiTests/MemoryGrowthProbe.cs
      - scripts/compare-memory.ps1
      - .github/workflows/memory-optimization.yml

permissions:
  contents: read

concurrency:
  group: memory-optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same application code as 1.0.75.0, with the diagnostic entry point.
          ref: 48cfcb3d57c46b5c51f80892df512c66d492c26e
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build identical diagnostic harnesses
        run: |
          Copy-Item tests/Keypivo.UiTests/MemoryGrowthProbe.cs baseline/tests/Keypivo.UiTests/MemoryGrowthProbe.cs
          dotnet publish baseline/tests/Keypivo.UiTests -c Release -r win-x64 --self-contained true -m:1 -p:UseSharedCompilation=false -o artifacts/memory-optimization/baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/Keypivo.UiTests -c Release -r win-x64 --self-contained true -m:1 -p:UseSharedCompilation=false -o artifacts/memory-optimization/fixed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare allocations and GC settings on the same runner
        env:
          INCLUDE_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.include_candidates }}
        run: |
          ./scripts/compare-memory.ps1 -Repeat ${{ matrix.repeat }} -IncludeCandidates:($env:INCLUDE_CANDIDATES -eq 'true')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: memory-optimization-${{ matrix.repeat }}-${{ github.sha }}
          path: artifacts/memory-optimization/results/*.json
          if-no-files-found: warn
          retention-days: 30
