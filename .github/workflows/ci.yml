name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      package-file: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Keypivo.slnx
      - name: Build
        run: dotnet build Keypivo.slnx -c Release --no-restore -m:1 -p:UseSharedCompilation=false
      - name: Run automated tests
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet run --project tests/Keypivo.Tests -c Release --no-build | Tee-Object -FilePath artifacts/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Store publishing guards without credentials
        run: ./scripts/test-store-publishing.ps1
      - name: Build and validate MSIX
        id: package
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $identity = $env:STORE_IDENTITY_NAME
          $publisher = $env:STORE_PUBLISHER
          $displayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          $values = @($identity, $publisher, $displayName)
          $configured = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configured -eq 0) {
            $identity = 'Keypivo.Validation'
            $publisher = 'CN=Keypivo CI'
            $displayName = 'Keypivo'
            'Validation identity: this package is not for Store submission.' >> $env:GITHUB_STEP_SUMMARY
          } elseif ($configured -ne 3) {
            throw 'Set all three STORE_IDENTITY_NAME, STORE_PUBLISHER, and STORE_PUBLISHER_DISPLAY_NAME variables.'
          }
          $run = [long]$env:GITHUB_RUN_NUMBER
          $minor = [long][Math]::Floor($run / 65536)
          $build = $run % 65536
          $version = "1.$minor.$build.0"
          ./scripts/package-store.ps1 -IdentityName $identity -Publisher $publisher -PublisherDisplayName $displayName -Version $version
          "file=keypivo-$version-x64.msix" >> $env:GITHUB_OUTPUT
          "Package version: $version (x64)" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keypivo-msix-${{ github.sha }}
          path: artifacts/store/*.msix
          if-no-files-found: error
          retention-days: 30
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tests.log
          if-no-files-found: warn
          retention-days: 14

  store:
    name: Submit Microsoft Store update
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STORE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: microsoft-store
    concurrency:
      group: microsoft-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keypivo-msix-${{ github.sha }}
          path: artifacts/store
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4
      - name: Submit the tested package
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.package-file }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: ./scripts/publish-store.ps1 -PackagePath (Join-Path 'artifacts/store' $env:PACKAGE_FILE)
