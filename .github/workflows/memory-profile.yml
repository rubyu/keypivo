name: Memory comparison

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - src/Keypivo.Core/ProcessCommandRunner.cs
      - tests/Keypivo.UiTests/MemoryProbe.cs
      - tests/Keypivo.UiTests/BaselineProcessCommandRunner.cs
      - .github/workflows/memory-profile.yml

permissions:
  contents: read

concurrency:
  group: memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build probe
        run: dotnet build tests/Keypivo.UiTests -c Release -m:1 -p:UseSharedCompilation=false
      - name: Measure identical tray workloads in fresh processes
        run: |
          foreach ($variant in @('baseline', 'fixed')) {
            dotnet run --project tests/Keypivo.UiTests -c Release --no-build -- --memory-probe $variant "artifacts/memory/$variant.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Summarize measurements
        run: |
          '| Variant | Idle private working set (MiB, average) | Idle private commit (MiB, average) | Idle handles (average) | Managed heap after GC (MiB) |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | ---: | ---: | ---: | ---: |' >> $env:GITHUB_STEP_SUMMARY
          foreach ($variant in @('baseline', 'fixed')) {
            $data = Get-Content "artifacts/memory/$variant.json" -Raw | ConvertFrom-Json
            $idle = @($data.Samples | Where-Object Phase -like 'idle-*')
            $resident = ($idle.PrivateWorkingSet | Measure-Object -Average).Average / 1MB
            $commit = ($idle.PrivateCommit | Measure-Object -Average).Average / 1MB
            $handles = ($idle.Handles | Measure-Object -Average).Average
            $heap = ($data.Samples | Where-Object Phase -eq 'after-gc').ManagedHeap / 1MB
            '| {0} | {1:F2} | {2:F2} | {3:F0} | {4:F2} |' -f $variant,$resident,$commit,$handles,$heap >> $env:GITHUB_STEP_SUMMARY
          }
          'Same tray context, 16 synthetic USB devices, 1,200 accelerated state reads, then 2 minutes at the normal 2-second interval. No USB commands or real device data. Forced GC occurs only at probe boundaries. These short controlled samples do not predict the 25-hour working set on a specific computer.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: memory-comparison-${{ github.sha }}
          path: artifacts/memory/*.json
          if-no-files-found: warn
          retention-days: 30
